<h2 mat-dialog-title>Invitar Usuarios</h2>

<form [formGroup]="userInvitationForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Correo Electrónico del usuario</mat-label>
        <input matInput formControlName="email" placeholder="Ej. john.doe@example.com">
        @if (userInvitationForm.controls.email.errors?.['required']) {
          <mat-error>El correo electrónico es obligatorio</mat-error>
        }
        @if (userInvitationForm.controls.email.errors?.['email']) {
          <mat-error>El correo electrónico no es válido</mat-error>
        }
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()" [disabled]="isLoading()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="userInvitationForm.invalid || isLoading()">
      @if (isLoading()) {
        Enviando...
      } @else {
        Enviar Invitación
      }
    </button>
  </mat-dialog-actions>
</form>
